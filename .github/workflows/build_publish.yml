name: Build and publish Firefly image

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Docker image tag; git tag without 'release-' prefix (e.g. 'xxxx.x.x')"
        required: true
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean
# Commenting out release trigger for now since we have not decided on publishing to GHCR.
#  release:
#    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout firefly repo at configured tag
      # ------------------------------------------------------------
      - name: Checkout Firefly
        uses: actions/checkout@v4
        with:
          repository: Caltech-IPAC/firefly
          ref: release-${{ inputs.tag_name }}
          path: firefly

      # ------------------------------------------------------------
      # Checkout Firefly online help
      # ------------------------------------------------------------
      - name: Checkout Firefly Help
        uses: actions/checkout@v4
        with:
          repository: Caltech-IPAC/firefly-help
          ref: master
          path: firefly-help

      # ------------------------------------------------------------
      # Setup Docker multi-platform build
      # ------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Login to GHCR (only if pushing)
      # ------------------------------------------------------------
      - name: Login to GHCR
        if: github.event_name == 'release' || inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Determine image tag
      # - Release: use release tag
      # - Manual: use firefly tag
      # ------------------------------------------------------------
      - name: Set image tag
        id: image_tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.push_image }}" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Build (and optionally push) multi-platform image
      # ------------------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: firefly/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || inputs.push_image == 'true' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.image_tag.outputs.tag }}
          build-args: |
            env=ops
          cache-from: type=gha
          cache-to: type=gha,mode=max