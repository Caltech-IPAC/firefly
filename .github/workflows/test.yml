name: Tests

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This makes src/firefly/jest.config.js drop the two suites
    # that read a firefly_test_data checkout, which the runner can't reach.
    env:
      FIREFLY_SKIP_TESTDATA: 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --ignore-platform --frozen-lockfile

      - name: JavaScript tests (jest)
        id: js-tests
        working-directory: src/firefly
        run: yarn run test-unit

      - name: Upload reports
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/dist/reports/firefly/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize
        if: '!cancelled()'
        env:
          COVERAGE: build/dist/reports/firefly/coverage-summary.json
        run: |
          {
            echo "## Test results"
            echo
            echo "| suite | result |"
            echo "| --- | --- |"
            echo "| JavaScript (jest) | ${{ steps.js-tests.outcome }} |"

            # Written by the json-summary reporter in __jest__/jest.base.config.js.
            # Absent when the test step dies before jest writes its report.
            if [ -f "$COVERAGE" ]; then
              echo
              echo "### Coverage"
              echo
              echo "| metric | covered | percent |"
              echo "| --- | --- | --- |"
              jq -r '.total as $t
                     | ["statements","branches","functions","lines"][]
                     | "| \(.) | \($t[.].covered)/\($t[.].total) | \($t[.].pct)% |"' "$COVERAGE"
            else
              echo
              echo "_No coverage report was produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
