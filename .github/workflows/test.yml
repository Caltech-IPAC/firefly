name: Tests

# Toolchain versions track docker/Dockerfile. This repo has no Gradle wrapper,
# so the Gradle version has to be pinned here.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Scoped to jest for now. The Java suite, and the two jest suites skipped below,
    # read a firefly_test_data checkout that no runner can reach; they go in once
    # there is a way to fetch it.
    env:
      FIREFLY_SKIP_TESTDATA: 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: yarn

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # jsTest only depends on loadConfig, so this skips prepareWebapp and the Java
      # compile entirely. -Xmx4g is the Gradle daemon heap, overriding gradle.properties' 8 GB.
      - name: JavaScript tests (jest)
        id: js-tests
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :firefly:jsTest

      - name: Upload reports
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/dist/reports/firefly/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize
        if: '!cancelled()'
        run: |
          {
            echo "## Test results"
            echo
            echo "| suite | result |"
            echo "| --- | --- |"
            echo "| JavaScript (jest) | ${{ steps.js-tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
