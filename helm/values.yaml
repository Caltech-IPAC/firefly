# -- Number of replicas. When > 1, Redis is automatically deployed and
# session affinity annotations are injected into the ingress.
replicaCount: 1

# -- Interval for cleaning up temporary files.
cleanupInterval: "1h"

image:
  # -- Image repository.
  repository: ghcr.io/caltech-ipac/firefly
  # -- Image tag. Defaults to appVersion in Chart.yaml when not set.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Container port.
  targetPort: 8080
  # -- Session affinity type. ClientIP is used as a fallback for non-ingress traffic.
  sessionAffinity: ClientIP
  # -- Session affinity timeout in seconds.
  sessionAffinityTimeout: 3600

ingress:
  # -- Enable ingress. If disabled, the service is only exposed internally and ingress settings are ignored.
  enabled: true
  # -- Ingress class name. Omit to use the cluster default. When set to nginx, traefik,
  # or haproxy, cookie-based session affinity annotations are automatically injected
  # when replicaCount > 1.
  className: ""
  # -- Additional ingress annotations.
  annotations: {}
  # -- Hostname. This value is environment-specific. The default value is a placeholder and should be overridden.
  host: firefly.example.com
  # -- Optional path prefix prepended to the Firefly path: [/pathPrefix]/firefly.
  pathPrefix: ""
  # -- TLS secret name. When set, TLS is enabled for the ingress host.
  tlsSecretName: ""

# -- Liveness probe configuration. Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  # @ignored
  httpGet:
    path: firefly/healthz
    port: 8080
  initialDelaySeconds: 120
  periodSeconds: 60
  timeoutSeconds: 10

# -- Resource requests and limits.
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

# -- Additional environment variables.
extraEnv: []
#  - name: FOO
#    value: bar

# -- Admin password configuration. When not set, ADMIN_PASSWORD is automatically generated by the application and printed in the logs on startup.
adminPassword:
  # -- Plain text password.
  value: ""
  # -- Name of the Kubernetes secret containing the password.
  secretName: ""
  # -- Key within the secret.
  secretKey: ""

# -- Persistence volume configuration. Each volume defaults to emptyDir.
# To use a new PVC: set pvc.size, pvc.storageClass, pvc.accessMode.
# To use an existing PVC: set existingClaim.
persistence:
  # -- Work directory volume.
  workDir: {}
  # -- Logs directory volume.
  logsDir: {}
  # -- Shared work directory volume. Use ReadWriteMany accessMode for multi-replica.
  sharedWorkDir: {}

# -- Pod security context. Shared by Firefly and Redis. When not set, containers
# run as the default image user (e.g. tomcat(91)).
securityContext: {}

redis:
  # -- Redis image.
  image: redis:6.2
  # -- Redis port.
  port: 6379
  # -- Redis maxmemory limit.
  maxmemory: 250M
  # -- Redis resource limits.
  resources:
    limits:
      memory: 256Mi
  # -- Redis persistence. Falls back to sharedWorkDir PVC if configured, otherwise emptyDir.
  persistence: {}

serviceAccount:
  # -- Create a service account.
  create: false
  # -- Service account name. Defaults to the release fullname when create is true.
  name: ""
