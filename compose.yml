services:
  firefly:
    image: ipac/firefly:${BUILD_TAG:-latest}  # value taken from shell, or latest
    build:
      context: ../
      dockerfile: firefly/docker/Dockerfile
      args:
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
    ports:
      - "8080:8080"
    env_file:
      - ./firefly-docker.env

  test:
    build:
      context: ../
      dockerfile: firefly/docker/Dockerfile
      target: base
    command: bash -c "cd firefly && gradle firefly:test"
    volumes: &volInfo
      - ../firefly_test_data:/opt/work/firefly_test_data
      - ../firefly:/opt/work/firefly
      - /opt/work/firefly/.gradle
      - /opt/work/firefly/build
      - /opt/work/firefly/jars/build
      - /opt/work/firefly/node_modules

  # Jest-only run, used by the GitHub Actions PR check. Builds from the same
  # Dockerfile and `base` target as `test`, so the toolchain stays defined in
  # one place; kept as its own service so the Jenkins `test` service is
  # unaffected.
  test-js:
    build:
      context: ../
      dockerfile: firefly/docker/Dockerfile
      target: base
    image: ipac/firefly-test-js:latest
    environment:
      # This makes src/firefly/jest.config.js drop the two test suites
      # that read a firefly_test_data checkout. Set it to false to run them.
      FIREFLY_SKIP_TESTDATA: ${FIREFLY_SKIP_TESTDATA:-true}
      JEST_MAX_WORKERS: ${JEST_MAX_WORKERS:-2}
    command: bash -c "cd firefly && gradle :firefly:jsTest"
    # No anonymous volume over build/, unlike `test`: the reports reach the
    # host through the bind below, so CI can upload them without a copy step.
    volumes:
      - ../firefly:/opt/work/firefly
      - /opt/work/firefly/.gradle
      - /opt/work/firefly/node_modules

  dev:
    build:
      context: ../
      dockerfile: firefly/docker/Dockerfile
      target: dev_env
    ports:
      - "8080:8080"
      - "5050:5050"
    env_file:
      - ./firefly-docker.env
    volumes: *volInfo
